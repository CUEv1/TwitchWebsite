<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Twitch Stats Dashboard</title>
    <meta
      name="description"
      content="Explore Twitch channel performance with real-time metrics, trends, and insights."
    />
    <style>
      body {
        margin: 0;
        font-family: "Inter", "Segoe UI", sans-serif;
        background: #0b0b10;
        color: #f5f5f7;
      }

      .app-fallback {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        padding: 2rem;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="app-fallback" id="app-fallback">
        <strong id="fallback-title">Loading dashboard...</strong>
        <span id="fallback-message">
          If this screen persists, run the app with <code>npm run dev</code> or
          <code>npm run preview</code> to ensure assets are served correctly.
        </span>
      </div>
    </div>
    <script>
      const fallbackTitle = document.getElementById("fallback-title");
      const fallbackMessage = document.getElementById("fallback-message");

      if (location.protocol === "file:" && fallbackTitle && fallbackMessage) {
        fallbackTitle.textContent = "Vite server not detected.";
        fallbackMessage.innerHTML =
          "Open this page with <code>npm run dev</code> and visit " +
          "<code>http://localhost:5173</code> to load the dashboard bundle.";
      }
    </script>
    <script
      type="module"
      src="/src/main.tsx"
      onerror="document.getElementById('fallback-title').textContent='Failed to load app bundle.';document.getElementById('fallback-message').innerHTML='Check the console and network tab for <code>main.tsx</code> or build output errors.';"
    ></script>
  </body>
</html>
