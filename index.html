<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Twitch Stats Dashboard</title>
    <meta
      name="description"
      content="Explore Twitch channel performance with real-time metrics, trends, and insights."
    />
    <style>
      body {
        margin: 0;
        font-family: "Inter", "Segoe UI", sans-serif;
        background: #0b0b10;
        color: #f5f5f7;
      }

      .app-fallback {
        min-height: 100vh;
        display: flex;
        flex-direction: column;

        justify-content: center;

        padding: 2rem;
        text-align: center;
      }

      <div class="app-fallback" id="app-fallback">

        <span>

          <code>npm run preview</code> to ensure assets are served correctly.
        </span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
